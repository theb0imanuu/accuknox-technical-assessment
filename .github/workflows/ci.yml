name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install eBPF Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc make iproute2

      - name: Compile eBPF Kernels
        run: make bpf

      - name: Build Go Userspace Control Planes
        run: make go

      - name: Run Problem 3 Concurrency Verification
        run: make test-p3

      - name: Verify Docker Build
        run: docker build -t accuknox-ebpf-interview .
